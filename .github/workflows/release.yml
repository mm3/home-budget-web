name: Release

# Pushing a tag like v3.1.0 attaches the built files to a GitHub release:
# the versioned ones to archive, and the plain names for a link that always
# points at the latest build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The action versions below are the ones that run on Node 24. GitHub
      # removed Node 20 from the runners on 23.09.2026, so anything still
      # pinned to it warns first and then stops working. node-version stays
      # at 22 on purpose: that is the Node this project's own scripts and
      # tests are checked against, and it is unrelated to the runtime the
      # actions themselves use.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Unit tests and coverage
        run: npm run coverage
      - name: Build
        run: |
          npm run build
          npm run build:plain
          npm run build:site
      - name: Check the built files in a browser
        # Uses the Chrome the hosted runner already ships - nothing is installed
        # and no kernel setting is touched. tools/cdp.mjs finds it, or says
        # plainly that it could not; CHROME_PATH points at another one.
        run: |
          npm run browser-check
          npm run site-check
      - name: Checksums
        run: |
          cd dist
          sha256sum home-budget*.html > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/home-budget-*.html
            dist/home-budget.html
            dist/home-budget.min.html
            dist/SHA256SUMS.txt
          generate_release_notes: true
