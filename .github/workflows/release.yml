name: Release

# Pushing a tag like v3.1.0 attaches the built files to a GitHub release:
# the versioned ones to archive, and the plain names for a link that always
# points at the latest build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and coverage
        run: npm run coverage
      - name: Build
        run: |
          npm run build
          npm run build:plain
          npm run build:site
      - name: Make sure a browser is installed
        # The browser checks drive a real Chrome over the DevTools protocol. Hosted
        # runners usually ship one; this installs one when they do not, and
        # tools/cdp.mjs finds whichever is there (CHROME_PATH overrides it).
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
            BROWSER="$(command -v google-chrome)"
          fi
          echo "Using $BROWSER - $("$BROWSER" --version)"
          # Ubuntu 24.04 blocks unprivileged user namespaces, which stops Chrome's
          # sandbox from starting. The checks pass --no-sandbox, and this covers the
          # rest; the runner is thrown away after the job either way.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
      - name: Check the built files in a browser
        run: |
          npm run browser-check
          npm run site-check
      - name: Checksums
        run: |
          cd dist
          sha256sum home-budget*.html > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/home-budget-*.html
            dist/home-budget.html
            dist/home-budget.min.html
            dist/SHA256SUMS.txt
          generate_release_notes: true
