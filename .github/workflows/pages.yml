name: Pages

# Publishes the app to GitHub Pages. The site is static, so the whole job is
# "check, build, upload". Enable it once under Settings -> Pages -> Source:
# GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The action versions below are the ones that run on Node 24. GitHub
      # removed Node 20 from the runners on 23.09.2026, so anything still
      # pinned to it warns first and then stops working. node-version stays
      # at 22 on purpose: that is the Node this project's own scripts and
      # tests are checked against, and it is unrelated to the runtime the
      # actions themselves use.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Unit tests and coverage
        run: npm run coverage
      - name: Build the site
        run: npm run build:site
      - name: Check the published build
        # Uses the Chrome the hosted runner already ships. Nothing is installed and
        # no kernel setting is touched here: a deploy should not be reaching for
        # root on a machine it does not own. tools/cdp.mjs finds the browser
        # (CHROME_PATH overrides it) and says so plainly when there is none - on a
        # self-hosted runner without one, install it in the runner's own image.
        run: npm run site-check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
