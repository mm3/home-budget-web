<meta name="description" content="Offline home budget: entries, categories, statistics, CSV/XLSX/PDF export and import.">
<title>Home Budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M7 14l9-7 9 7v11H7z' fill='white'/%3E%3Ccircle cx='16' cy='18' r='3.4' fill='%2322c55e'/%3E%3C/svg%3E">
<style>/* Home Budget - light and dark theme, mobile and desktop layouts */

:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --border: #e2e5ea;
  --text: #171a21;
  --muted: #667085;
  --accent: #4f46e5;
  --accent-text: #ffffff;
  --income: #15803d;
  --expense: #c2410c;
  --danger: #dc2626;
  --warn: #b45309;
  --bar-expense: #f97316;
  --bar-income: #22c55e;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .06);
  color-scheme: light;
}

/* Dark palette: the body gets the "dark" class from the theme setting or the system preference. */
body.dark {
  --bg: #0f1116;
  --surface: #171a21;
  --surface-2: #1f232c;
  --border: #2a2f3a;
  --text: #e7e9ee;
  --muted: #98a2b3;
  --accent: #818cf8;
  --accent-text: #0f1116;
  --income: #4ade80;
  --expense: #fb923c;
  --danger: #f87171;
  --warn: #fbbf24;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-size: 1rem; }
h2 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }

.muted { color: var(--muted); font-size: .88rem; }
.block { display: block; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.income { color: var(--income); }
.expense { color: var(--expense); }
.error { color: var(--danger); margin-top: 6px; }
.warning { color: var(--warn); }
.spacer { flex: 1; }

/* ---------- app bar ---------- */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.logo {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}
.tabs { display: flex; gap: 4px; }
.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
  cursor: pointer;
}
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.active { background: var(--surface-2); color: var(--text); }
.tab-icon { font-size: 1.05rem; }

.main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 18px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.app-footer {
  padding: 0 16px 28px;
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
}

.toast {
  max-width: 1080px;
  margin: 12px auto -4px;
  padding: 10px 14px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--income) 14%, transparent);
  color: var(--income);
  font-weight: 600;
}
.toast.error { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-title { color: var(--muted); font-weight: 600; font-size: .85rem; }
.stat-value { font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.stat-sub { color: var(--muted); font-size: .78rem; }

/* ---------- quick add ---------- */
.quick-card { padding-bottom: 12px; }
.quick-form { display: flex; gap: 10px; align-items: stretch; }
.quick-input-wrap { position: relative; flex: 1; }
.quick-input {
  width: 100%;
  padding: 14px 44px 14px 14px;
  font-size: 1.5rem;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-2);
}
.quick-currency {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1.1rem;
}
.quick-message { margin-top: 8px; font-size: .88rem; min-height: 1.2em; color: var(--muted); }
.quick-message.ok { color: var(--income); }
.quick-message.error { color: var(--danger); }

/* ---------- buttons and inputs ---------- */
button {
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--surface-2); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--danger); }
button.link {
  border: 0;
  background: none;
  padding: 4px 6px;
  color: var(--accent);
  font-weight: 600;
}
button.link.danger { color: var(--danger); }
.button-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.file-button {
  display: inline-flex;
  align-items: center;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface);
}
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.segmented button { border: 0; border-radius: 0; background: var(--surface); padding: 7px 12px; color: var(--muted); }
.segmented button.active { background: var(--surface-2); color: var(--text); }

input, select {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  max-width: 100%;
}
input[type="color"] { padding: 2px; width: 48px; height: 36px; }
input:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { color: var(--muted); font-size: .8rem; font-weight: 600; }
.field-hint { color: var(--muted); font-size: .75rem; }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.filters-box { margin-bottom: 4px; }
.filters-box > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .85rem; padding: 4px 0; }
.filters-box[open] > summary { margin-bottom: 8px; }
.entry-row { cursor: pointer; }
.filter-actions { display: flex; gap: 8px; }
.inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; }

/* ---------- lists and tables ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0; font-size: .9rem; font-weight: 600; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  padding: 0 8px 8px;
  border-bottom: 1px solid var(--border);
}
th.num { text-align: right; }
td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.row-actions { white-space: nowrap; text-align: right; }
.category-icon { font-size: 1.05em; margin-right: 7px; line-height: 1; }
.legend-icon { font-size: 1em; }
.small { font-size: .78rem; }
.row-2 { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: end; }
.icon-input { width: 64px; font-size: 1.2rem; text-align: center; }
.icon-picker { display: flex; flex-wrap: wrap; gap: 4px; }
.icon-choice { padding: 4px 7px; font-size: 1.05rem; border-radius: 8px; }
.card-summary { font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.translation-table { max-height: 320px; overflow: auto; }
.translation-table input { width: 100%; }
.fill.over { background: var(--danger) !important; }
.badge.over { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 8px;
  border-radius: 50%;
  vertical-align: baseline;
}
.badge {
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: .7rem;
  font-weight: 700;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 99px;
  background: var(--surface-2);
}
.entry-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.entry:last-child { border-bottom: 0; }
.entry:hover { background: var(--surface-2); }
.entry-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.entry-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-sub { color: var(--muted); font-size: .8rem; }
.entry-amount { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

.bar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.bar-head { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; margin-bottom: 5px; }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; }

/* ---------- charts ---------- */
.chart-box { width: 100%; height: 220px; }
.chart-box.tall { height: 280px; }
.chart { width: 100%; height: 100%; display: block; }
.bar-expense { fill: var(--bar-expense); }
.bar-income { fill: var(--bar-income); }
.grid { stroke: var(--border); stroke-width: 1; }
svg .grid { fill: none; }
.chart-label { fill: var(--muted); font-size: 10px; }
.donut-empty { fill: none; stroke: var(--surface-2); stroke-width: 26; }
.donut-box { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.donut { width: 160px; height: 160px; flex: none; }
.legend { display: flex; gap: 14px; margin-top: 8px; color: var(--muted); font-size: .8rem; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.toggle input { width: 14px; height: 14px; }
.chart-scale { fill: var(--muted); font-size: 10px; }
.average-line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.average-label { fill: var(--accent); font-size: 10px; font-weight: 600; }
.key::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 6px;
  border-radius: 3px;
  background: var(--bar-expense);
}
.key.income::before { background: var(--bar-income); }
.legend-list { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 160px; }
.legend-list li { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: .88rem; }
.legend-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- transfer ---------- */
.transfer { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.transfer-block { display: flex; flex-direction: column; gap: 8px; }
.transfer-block h3 { font-size: .95rem; }
.import-preview {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- dialog ---------- */
.dialog {
  width: min(440px, calc(100vw - 32px));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  padding: 16px;
}
.dialog::backdrop { background: rgba(15, 17, 22, .45); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.dialog-form { display: flex; flex-direction: column; gap: 12px; }
.dialog-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }

/* ---------- mobile ---------- */
@media (max-width: 720px) {
  body[data-mode="auto"] .tab-label { display: none; }
  body[data-mode="auto"] .grid,
  body[data-mode="auto"] .transfer { grid-template-columns: 1fr; }
  body[data-mode="auto"] .app-bar { gap: 10px; }
  body[data-mode="auto"] .hide-sm,
  body[data-mode="auto"] .row-actions { display: none; }
  body[data-mode="auto"] .main { padding: 14px 12px 32px; }
}

body[data-mode="mobile"] .tab-label { display: none; }
body[data-mode="mobile"] .grid,
body[data-mode="mobile"] .transfer { grid-template-columns: 1fr; }
body[data-mode="mobile"] .hide-sm,
body[data-mode="mobile"] .row-actions { display: none; }
body[data-mode="mobile"] .main { max-width: 560px; padding: 14px 12px 32px; }
body[data-mode="mobile"] .cards { grid-template-columns: repeat(2, 1fr); }
body[data-mode="mobile"] .app-bar { position: sticky; }
body[data-mode="mobile"] .tabs { flex: 1; justify-content: space-around; }

body[data-mode="desktop"] .main { max-width: 1080px; }
body[data-mode="desktop"] .grid { grid-template-columns: 1.3fr 1fr; }
</style>
</head>
